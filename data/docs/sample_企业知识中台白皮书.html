<h1>企业知识中台 2026 白皮书</h1>
<p>本白皮书阐述企业知识中台的建设思路与关键指标。</p>
<h2>一、建设目标</h2>
<p>统一知识入口，问答准确率目标 95% 以上，检索延迟 P95 小于 800 毫秒。</p>
<h2>二、核心指标</h2>
<table border="1">
<tr><th>指标</th><th>目标值</th></tr>
<tr><td>问答准确率</td><td>95%</td></tr>
<tr><td>检索延迟 P95</td><td>800ms</td></tr>
<tr><td>知识覆盖率</td><td>90%</td></tr>
</table>
<h2>三、预算</h2>
<p>2026 年信息化预算 1500 万元，其中知识中台占 300 万元。</p>
